kind: Environment
name: ytkk
type: primary
components:
    -
        kind: Application
        name: yt
        gitRepo: 'https://github.com/haree322-lab/YT.git'
        gitBranch: main
        gitApplicationPath: /
        resources:
            cpu: '2'
            memory: 4Gi
        dockerCompose:
            build:
                context: ./
                dockerfile: Dockerfile
            ports:
                - '10000:10000'
            environment:
                PORT: '10000'
                PYTHONUNBUFFERED: '1'
                CORS_ORIGIN: '*'
        hosts:
            -
                hostname: 'yt-backend-{{env.base_domain}}'
                path: /
                servicePort: 10000

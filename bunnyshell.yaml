kind: Environment
name: ytkk
type: primary
components:
    -
        kind: Application
        name: yt
        gitRepo: 'https://github.com/haree322-lab/YT.git'
        gitBranch: main
        gitApplicationPath: /
        resources:
            cpu: '2'
            memory: 4Gi
        dockerCompose:
            build:
                context: ./
                dockerfile: Dockerfile
            ports:
                - '10000:10000'
            environment:
                PORT: '10000'
                PYTHONUNBUFFERED: '1'
                CORS_ORIGIN: '*'
                # Telegram Bot — set real values in BunnyShell Secrets panel
                TELEGRAM_BOT_TOKEN: ''
                TELEGRAM_ALLOWED_USERS: ''
                TELEGRAM_API_ID: ''
                TELEGRAM_API_HASH: ''
        hosts:
            -
                hostname: 'yt-${env.unique}.bunnyenv.com'
                path: /
                servicePort: 10000
                public: true
